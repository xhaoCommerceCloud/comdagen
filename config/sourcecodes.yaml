sourcecodes:
  # number of generated source code groups
  # NOTE: elementCount is ignored when pricebooks are available
  # The actual group count is calculated as: ceil(number_of_pricebooks / pricebooksPerGroup)
  elementCount: 0
  
  # range of codes per source code group
  minCodes: 1
  maxCodes: 1

  # fixed number of pricebooks per source code group
  # pricebooks are distributed sequentially - each pricebook assigned to exactly one group
  # Example: 5000 pricebooks with pricebooksPerGroup=5 creates 1000 groups
  pricebooksPerGroup: 5

